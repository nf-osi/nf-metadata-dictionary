name: Claude review

# Two ways to get Claude on a PR:
#
# 1. Add `nfosi-service` as a reviewer. GitHub can't list an app in the
#    reviewers menu, so this account stands in for Claude. Requesting it
#    triggers a full review; re-requesting it reviews again.
# 2. Mention `@claude` in a PR comment, review, or inline comment
#    (e.g. "@claude review" or "@claude why is this slot required?").
#
# Both run on ANTHROPIC_API_KEY. The action only runs for actors with write
# access to the repo. Fork PRs are skipped because they can't read secrets.

on:
  pull_request:
    types: [review_requested]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    name: Review (requested via nfosi-service)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.requested_reviewer.login == 'nfosi-service' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request following the "Reviewing pull requests"
            guidance in .claude/CLAUDE.md. Read it before starting.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    name: Respond to @claude
    if: >-
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
