name: Weekly Annotation Key Audit

# Read-only audit for mis-cased annotation keys on NF-OSI Synapse projects
# (issue #939). Two defects leave the same concept under two keys:
#
#   * a legacy schematic path wrote the schema's PascalCase `rdfs:label`
#     alongside the correct camelCase `sms:displayName` (`Age` and `age`)
#   * schema slot renames left the former name behind (`timePointUnit` after it
#     became `timepointUnit`)
#
# Either way the portal fileview only reads the canonical key, so the stray one
# is noise at best and hidden metadata at worst. This job exists so a
# recurrence is noticed in a week rather than in three years.
#
# Deliberately NOT a step in weekly-model-system-sync.yml: that job's success
# criterion is "opened a PR editing modules/", and an audit that must fail
# loudly does not belong in a job whose failure mode is a missing PR.
#
# This job never writes to Synapse. Remediation is a curator-run local task via
# utils/fix_annotation_keys.py, which is why that script is not wired into CI.

on:
  schedule:
    # Mondays at 11:00 UTC, two hours after weekly-model-system-sync.
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      projects:
        description: 'Comma-separated project synIDs (default: every portal study)'
        required: false
        type: string
        default: ''
      workers:
        description: 'Parallel scan workers'
        required: false
        type: string
        default: '10'
      max_unscanned:
        description: 'Unreadable projects tolerated before warning'
        required: false
        type: string
        default: '0'

permissions:
  contents: read
  issues: write

env:
  PROJECTS_TABLE: syn52694652
  # Named in the issue comment as the worst-affected project but not a portal
  # study row, so it has to be added explicitly.
  EXTRA_PROJECT: syn35221462
  TRACKING_ISSUE_TITLE: 'Annotation key drift detected on NF-OSI Synapse projects'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install synapseclient pyyaml

      - name: Verify the data model artifact is present
        run: |
          # The audit derives canonical slot names from dist/NF.yaml. Without it
          # every key looks unrecognised and the report would be nonsense.
          test -s dist/NF.yaml || {
            echo "::error::dist/NF.yaml is missing or empty; cannot derive canonical slot names"
            exit 1
          }

      - name: Audit annotation keys
        id: audit
        env:
          SYNAPSE_AUTH_TOKEN: ${{ secrets.DATA_MODEL_SERVICE }}
          # Dispatch inputs go through the environment, never into the script
          # body: an `${{ }}` expansion is substituted as text before bash parses
          # the line, so `syn1"; curl ...` in an input would run as source in a
          # job holding the Synapse token and `issues: write`.
          PROJECTS: ${{ github.event.inputs.projects }}
          WORKERS: ${{ github.event.inputs.workers || '10' }}
          MAX_UNSCANNED: ${{ github.event.inputs.max_unscanned || '0' }}
        run: |
          set +e
          ARGS="--out-dir audit --workers $WORKERS"
          ARGS="$ARGS --max-unscanned $MAX_UNSCANNED"
          if [ -n "$PROJECTS" ]; then
            for PROJECT in $(echo "$PROJECTS" | tr ',' ' '); do
              ARGS="$ARGS --project $PROJECT"
            done
          else
            ARGS="$ARGS --projects-table $PROJECTS_TABLE --extra-project $EXTRA_PROJECT"
          fi

          echo "Running: python utils/audit_annotation_keys.py $ARGS --fail-on-findings"
          python utils/audit_annotation_keys.py $ARGS --fail-on-findings > /dev/null
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f audit/summary.md ]; then
            cat audit/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No report was produced; the scan failed before writing one." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annotation-key-audit
          path: audit/
          retention-days: 90

      - name: Open or update the tracking issue
        # Exit 1 means repairable findings. A PR is the wrong artifact here -
        # there is nothing in this repo to change, the drift is in Synapse. One
        # issue updated in place, so a recurring failure does not spam.
        if: always() && steps.audit.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=issue_body.md
          {
            echo "The weekly annotation key audit found mis-cased annotation keys on NF-OSI Synapse projects."
            echo ""
            echo "Run: [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) - the full CSV report is attached to that run as the \`annotation-key-audit\` artifact."
            echo ""
            echo "Remediate with \`utils/fix_annotation_keys.py\` (dry run by default). Record accepted findings in \`utils/annotation_key_allowlist.yaml\` so this issue can close."
            echo ""
            cat audit/summary.md
          } > "$BODY_FILE"

          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "\"${{ env.TRACKING_ISSUE_TITLE }}\" in:title" \
            --json number --jq '.[0].number')

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue edit "$EXISTING" --repo "${{ github.repository }}" --body-file "$BODY_FILE"
          else
            echo "Opening a new tracking issue"
            gh issue create --repo "${{ github.repository }}" \
              --title "${{ env.TRACKING_ISSUE_TITLE }}" \
              --label bug \
              --body-file "$BODY_FILE"
          fi

      - name: Fail the job on findings or on lost coverage
        # Exit 2 fails the job too. A warning annotation on a green job is
        # exactly what gets ignored, and "0 findings, 60 unreadable projects" must
        # never read as clean. The two messages stay distinguishable so a reader
        # can tell repairable drift from lost coverage. What keeps this from going
        # permanently red is the pair of escape hatches the audit already has:
        # accept a key in utils/annotation_key_allowlist.yaml, or raise
        # --max-unscanned for projects the service account genuinely cannot read.
        if: always()
        run: |
          CODE="${{ steps.audit.outputs.exit_code }}"
          case "$CODE" in
            0) echo "✅ No mis-cased annotation keys found." ;;
            1) echo "::error::Audit found mis-cased annotation keys (exit 1). See the job summary."; exit 1 ;;
            2) echo "::error::Audit could not vouch for its own coverage (exit 2): unreadable projects, or probable misspellings of a schema slot. Accept a key in utils/annotation_key_allowlist.yaml or raise --max-unscanned once triaged. See the job summary."; exit 1 ;;
            *) echo "::error::Audit failed to run (exit $CODE). See the job summary."; exit 1 ;;
          esac
