name: Weekly Model System Sync

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allow manual triggering

env:
  # NF Research Tools Central view (replaces the retired Resource table syn26450069)
  SYNAPSE_TOOLS_TABLE_ID: syn51730943

jobs:
  sync-model-systems:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "date-short=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install synapseclient pyyaml pandas

      - name: Sync model system data
        # Source tables are open access; the sync runs anonymously (no login).
        run: |
          python utils/sync_model_systems.py --synapse-id ${{ env.SYNAPSE_TOOLS_TABLE_ID }}

      - name: Check for changes
        id: changes
        run: |
          if [[ $(git status --porcelain modules/) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in modules/"
            echo ""
            echo "Modified files:"
            git status --porcelain modules/
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekly model system sync"
          title: "Weekly Model System Sync - ${{ steps.date.outputs.date }}"
          body: |
            This PR contains the weekly sync of model systems and tools from Synapse.

            **Sync Date:** ${{ steps.date.outputs.date }}

            **Source:** NF Research Tools Central `${{ env.SYNAPSE_TOOLS_TABLE_ID }}`

            Only `modules/` source files are updated here. Build artifacts (`dist/`, `NF.jsonld`, etc.) are regenerated after this PR is merged into main.

            **Automated via:** `.github/workflows/weekly-model-system-sync.yml`
          branch: sync/weekly-maintenance-${{ steps.date.outputs.date-short }}
          labels: |
            automated
            weekly-sync
          draft: false

      - name: Workflow summary
        if: always()
        run: |
          echo "### Weekly Model System Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.changes }}" = "true" ]; then
            echo "Changes detected; a pull request has been created with the updates." >> $GITHUB_STEP_SUMMARY
          else
            echo "No changes needed - dictionary is up to date." >> $GITHUB_STEP_SUMMARY
          fi
