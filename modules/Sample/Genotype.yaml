enums:
  Genotype:
    permissible_values:
      '+/+':
        description: Homozygous wildtype
      '+/-':
        description: Heterozygous deletion or mutation
      '-/-':
        description: Homozygous deletion or mutation.
      Unknown:
        aliases:
        - Not Known
        - U
        - UNK
        - Unknown/Not Stated
        description: unknown
  NF1GenotypeEnum:
    description: >-
      NF1-specific genotypes that name a recurrent variant allele. Used alongside the generic
      Genotype enum for nf1Genotype only, so these values are not valid for other genes.
    permissible_values:
      R1947X/+:
        description: >-
          Heterozygous for the recurrent NF1 nonsense variant p.Arg1947* (R1947X, c.5839C>T)
          with one wildtype allele.
  NF1Variant:
    permissible_values:
      R816X:
        description: A pathogenic mutation in the NF1 gene (amino acid nomenclature) leading to a truncated protein
