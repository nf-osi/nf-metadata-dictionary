  ManifestationEnum:
    description: 'Phenotype(s) studied, used as the dataset- and study-level facet vocabulary for the NF Data Portal. Neoplasm values MUST use label strings identical to the corresponding value in the Tumor enum, so that file-level tumorType annotations roll up to manifestation without a vocabulary crosswalk. The non-neoplasm phenotype and outcome values (Behavioral, Cognition, Hearing Loss, Memory, Pain, Quality of Life, Vision Loss) are exempt from that rule, as they have no Tumor counterpart. Values are deprecated rather than renamed or deleted, because a deprecated permissible value remains valid in the generated JSON Schema; removal is a separate major-release step gated on a zero-usage check.'
