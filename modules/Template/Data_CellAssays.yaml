classes:
  CellTissuePhenotypingTemplate:
    annotations:
      required: false
      requiresComponent: ''
      templateUsage: common
      templateFor:
        dataType:
        - physiology parameter
        - morphology parameter
        - volume
        - weight
        assay:
        - cell competition
        - cell count
        - cell proliferation
        - cell viability assay # viability measured by non-plate-based method
        - complex II enzyme activity assay
        - BrdU proliferation assay
        - electrochemiluminescence
        - focus forming assay
        - in vivo tumor growth
        - in vitro tumorigenesis
      dataGranularity: specimen-level
    description: 'Data that characterizes cell/tissue morphology or physiology often
      in the context of different experimental conditions'
    is_a: BiologicalAssayDataTemplate
    mixins:
    - SpecimenLineage
    - GenePerturbation
    - TimedObservation
    - CompoundTreatment
    slots:
    - modelSystemName
    - experimentalFactor
    - experimentalCondition
    - comments
    rules:
    - description: 'Relaxed conditional validation (issue #825): the listed fields
        are required only for experimentalData. Auxiliary co-located files (manifest,
        metadata, report, workflow report, tool, result, weblink, protocol) are exempt.'
      preconditions:
        slot_conditions:
          resourceType:
            equals_string: experimentalData
      postconditions:
        slot_conditions:
          specimenID:
            value_presence: PRESENT
    slot_usage:
      specimenID:
        required: false
  FlowCytometryTemplate:
    annotations:
      required: false
      requiresComponent: ''
      templateUsage: common
      templateFor:
        dataType:
        - immunoassay
        assay:
        - flow cytometry
      dataGranularity: specimen-level
    close_mappings:
    - https://www.immport.org/shared/dataModelDocumentation?table=fcs_analyzed_result
    description: Template for flow cytometry assay
    is_a: BiologicalAssayDataTemplate
    slots:
    - platform
    - cellType
    - auxiliaryAsset
    slot_usage:
      assay:
        range: CellBasedAssayEnum
        ifabsent: string(flow cytometry)
      platform:
        any_of:
        - range: FlowCytometryPlatformEnum
        - range: OtherPlatformEnum
        required: false
      fileFormat:
        any_of:
        - range: OtherFileFormatEnum
        - range: ImagingFileFormatEnum

  ElectrophysiologyAssayTemplate:
    annotations:
      templateUsage: common
      templateFor:
        dataType:
        - electrophysiology
        assay:
        - local field potential recording
        - long term potentiation assay
        - multi-electrode array
        - pattern electroretinogram
        - whole-cell patch clamp
      dataGranularity: specimen-level
    description: Template for raw electrophysiology data (electrical recordings).
    is_a: BiologicalAssayDataTemplate
    mixins:
    - TimedObservation
    slots:
    - platform
    - bodySite
    - cellType
    - recordingSource
    - experimentalCondition
    - auxiliaryAsset
    source: https://arxiv.org/pdf/1605.07673.pdf
    slot_usage:
      assay:
        range: CellBasedAssayEnum
      fileFormat:
        any_of:
        - range: OtherFileFormatEnum
        - range: TabularFileFormatEnum
      platform:
        required: false
    rules:
    - description: 'Relaxed conditional validation (issue #825): the listed fields
        are required only for experimentalData. Auxiliary co-located files (manifest,
        metadata, report, workflow report, tool, result, weblink, protocol) are exempt.'
      preconditions:
        slot_conditions:
          resourceType:
            equals_string: experimentalData
      postconditions:
        slot_conditions:
          platform:
            value_presence: PRESENT
  PlateBasedReporterAssayTemplate:
    annotations:
      required: false
      requiresComponent: ''
      templateUsage: most_common
      templateFor:
        dataType:
        - drug screen
        - drug combination screen
        - pharmacokinetics
        assay:
        - 2D AlamarBlue absorbance
        - 2D AlamarBlue fluorescence
        - cell viability assay
        - combination library screen
        - combination screen
        - compound screen
        - ELISA
        - sandwich ELISA
      dataGranularity: specimen-level
    description: Generic template for describing data from a plate-based reporter
      assay.
    is_a: BiologicalAssayDataTemplate
    mixins:
    - SpecimenLineage
    - TimedObservation
    - CompoundTreatment
    slots:
    - platform
    - assayTarget
    - experimentalCondition
    - reporterGene
    - reporterSubstance
    slot_usage:
      assay:
        range: CellBasedAssayEnum
      platform:
        any_of:
        - range: PlateReaderPlatformEnum
        - range: OtherPlatformEnum
        required: false
      fileFormat:
        range: TabularFileFormatEnum
      individualID:
        required: false
      compoundName:
        required: false
      compoundDose:
        required: false
      compoundDoseUnit:
        required: false
      specimenID:
        required: false
    rules:
    - description: 'Relaxed conditional validation (issue #825): the listed fields
        are required only for experimentalData. Auxiliary co-located files (manifest,
        metadata, report, workflow report, tool, result, weblink, protocol) are exempt.'
      preconditions:
        slot_conditions:
          resourceType:
            equals_string: experimentalData
      postconditions:
        slot_conditions:
          specimenID:
            value_presence: PRESENT
          compoundName:
            value_presence: PRESENT
          compoundDose:
            value_presence: PRESENT
