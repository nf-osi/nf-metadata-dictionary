classes:
  PortalStudy:
    annotations:
      templateUsage: internal
      synapse_table_id: syn52694652
    attributes:
      accessRequirements:
        range: string
        required: false
      acknowledgementStatements:
        range: string
        required: false
      externalRepositoryUri:
        range: string
        required: false
      clinicalTrialID:
        multivalued: true
        maximum_cardinality: 5
        range: string
        required: false
        annotations:
          maxLength: 30
      dataCoordinatingCenter:
        range: string
        required: false
        description: The organization or center responsible for coordinating data
          management and sharing for this study. Defaults to "NF-OSI".
        ifabsent: string(NF-OSI)
      dataStatus:
        range: DataStatusEnum
        required: true
        annotations:
          maxLength: 40
      dataType:
        multivalued: true
        maximum_cardinality: 15
        range: Data
        required: false
        annotations:
          maxLength: 100
      diseaseFocus:
        multivalued: true
        maximum_cardinality: 3
        range: DiseaseFocusEnum
        required: false
        annotations:
          maxLength: 50
      embargoEndDate:
        range: string
      fundingAgency:
        multivalued: true
        maximum_cardinality: 5
        range: string
        required: true
        annotations:
          maxLength: 49
      grantDOI:
        multivalued: true
        maximum_cardinality: 10
        range: string
        required: false
        annotations:
          maxLength: 80
      grantEndDate:
        range: string
      grantStartDate:
        range: string
      initiative:
        range: string
        required: true
        annotations:
          maxLength: 100
      institutions:
        multivalued: true
        maximum_cardinality: 10
        range: Institution
        required: true
        annotations:
          maxLength: 242
      manifestation:
        description: Refers to the phenotype(s) studied in the study. Omit if not applicable.
          Use the canonical spellings "Malignant Peripheral Nerve Sheath Tumor", "ANNUBP",
          "Juvenile Myelomonocytic Leukemia" and "Spinal Meningioma".
        multivalued: true
        maximum_cardinality: 5
        range: ManifestationEnum
        required: false
        title: Manifestation(s)
        annotations:
          maxLength: 50
      nextPhaseProject:
        range: string
        required: false
        description: Synapse project ID of a follow-up project that represents a subsequent
          funding phase, extension, or continuation of this study's research effort.
        exact_mappings:
        - https://schema.org/successorOf
      previousPhaseProject:
        range: string
        required: false
        description: Synapse project ID of the previous project that this study continues
          or extends, typically representing an earlier funding phase of the same
          research effort.
        exact_mappings:
        - https://schema.org/predecessorOf
      relatedStudies:
        multivalued: true
        maximum_cardinality: 10
        range: string
        required: false
      releasedDate:
        range: string
      studyFileviewId:
        range: string
        required: true
      studyId:
        range: string
        required: true
      studyLeads:
        multivalued: true
        maximum_cardinality: 10
        range: string
        required: true
        annotations:
          maxLength: 40
      studyName:
        range: string
        required: true
        annotations:
          maxLength: 256
      studyStatus:
        range: StudyStatusEnum
        required: true
        annotations:
          maxLength: 20
      summary:
        range: string
        required: true
    description: 'A scientific project of some planned duration with PIs and key contributors,
      specific research topics, and potential publication/data/other outputs.  A study
      is often represented as a Synapse project and so is also referred to as "project".
      The study schema here is specifically for studies listed on the NF Portal at
      https://nf.synapse.org/Explore/Studies.'
    notes:
    - There are small differences for the public portal representation of study vs.
      elsewhere such as in the less-public data sharing plan, but it should always
      be possible to translate DSP rep to the portal study rep.
    - 'Synapse table alignment (see the synapse_table_id annotation): each multivalued
      attribute''s maximum_cardinality maps to the maximumListLength of the matching
      STRING_LIST/ENTITYID_LIST column in the production table, and is generated into
      the JSON schema as maxItems. Each attribute''s maxLength annotation maps to the
      column''s maximumSize (for list columns, the maximum size of each item).'
    - 'maxLength is a workaround: LinkML has no constraint for string length, so it is
      recorded as an annotation, which the build strips from dist/NF.yaml. Do not
      generate it into the JSON schema; the strict downstream system rejects extra
      metadata.'
