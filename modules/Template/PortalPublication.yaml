classes:
  PortalPublication:
    annotations:
      templateUsage: internal
      synapse_table_id: syn16857542
    attributes:
      diseaseFocus:
        range: DiseaseFocusEnum
        required: false
        title: Disease Focus
        annotations:
          maxLength: 30
      fundingAgency:
        multivalued: true
        maximum_cardinality: 8
        range: string
        required: true
        title: Linked Funder(s)
        annotations:
          maxLength: 50
      manifestation:
        description: Refers to the phenotype(s) described in the publication. Unlike
          the dataset- and study-level fields of the same name, this field is free
          text and is not bound to ManifestationEnum; aligning it is pending an audit
          of the existing values.
        range: string
        required: false
        multivalued: true
        maximum_cardinality: 5
        title: Manifestation
        annotations:
          maxLength: 30
      publicationType:
        description: 'Type of publication in relation to the linked study on the NF
          Portal. A primary publication is the main publication for the study and
          may describe data or resources generated from the study. A secondary publication
          references or describes reuse of resources for the linked study.'
        range: PublicationTypeEnum
        required: true
        title: Publication Type
        annotations:
          maxLength: 20
      studyId:
        multivalued: true
        maximum_cardinality: 5
        range: string
        required: true
        title: Linked Study ID
        annotations:
          maxLength: 20
      studyName:
        multivalued: true
        maximum_cardinality: 5
        range: string
        required: true
        title: Linked Study Name
        annotations:
          maxLength: 200
    description: Publication entity defined within the specific scope of the NF Portal (WIP).
    notes:
    - 'Synapse table alignment (see the synapse_table_id annotation): each multivalued
      attribute''s maximum_cardinality maps to the maximumListLength of the matching
      STRING_LIST/ENTITYID_LIST column in the production table, and is generated into
      the JSON schema as maxItems. Each attribute''s maxLength annotation maps to the
      column''s maximumSize (for list columns, the maximum size of each item).'
    - 'maxLength is a workaround: LinkML has no constraint for string length, so it is
      recorded as an annotation, which the build strips from dist/NF.yaml. Do not
      generate it into the JSON schema; the strict downstream system rejects extra
      metadata.'

  PublicationTemplate:
    annotations:
      templateUsage: specialized
    attributes:
      abstract:
        range: string
        required: true
        title: Abstract
      accessibility:
        range: PublicationAccessibilityEnum
        required: false
        title: Accessibility
      author:
        multivalued: true
        range: string
        required: true
        title: Author(s)
      doi:
        range: string
        required: true
        title: Digital Object Identifier
      grantNumber:
        range: string
        required: false
        title: Grant Number
      journal:
        range: string
        required: true
        title: Journal
      pmid:
        range: string
        required: true
        title: PubMed ID
      title:
        range: string
        required: true
        title: Title
      year:
        range: integer
        required: true
        title: Year
    description: Publication based on MC2 model
