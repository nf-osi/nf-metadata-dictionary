# Each fixture validates a real fileFormat value against the template-specific
# compiled JSON Schema. Metadata resources avoid unrelated experimental-data
# requirements while still exercising the required fileFormat enum constraint.

schema: MRIAssayTemplate
instances:
  - file: data/MRIAssayTemplate/valid_fileformat_zip.json
    description: MRI template permits ZIP archives of raw DICOM series.
    expected: valid
  - file: data/fileformat/invalid_fileformat_unknown.json
    description: MRI template rejects an unknown file format.
    expected: invalid
