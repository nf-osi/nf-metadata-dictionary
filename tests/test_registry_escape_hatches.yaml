# Controlled values and conditional dependencies for issues #960 and #961.

schema: ClinicalAssayTemplate
instances:
  - file: data/ClinicalAssayTemplate/valid_compound_dose_category.json
    description: A controlled non-numeric compound dose does not require a unit.
    expected: valid
  - file: data/ClinicalAssayTemplate/valid_numeric_compound_dose.json
    description: A numeric compound dose is valid when accompanied by its unit.
    expected: valid
  - file: data/ClinicalAssayTemplate/invalid_numeric_compound_dose_missing_unit.json
    description: A numeric compound dose without a unit violates the conditional dependency.
    expected: invalid
    reason: numeric compoundDose requires compoundDoseUnit
  - file: data/ClinicalAssayTemplate/invalid_compound_dose_na.json
    description: The redundant NA dose category is not accepted.
    expected: invalid
    reason: NA is not a CompoundDoseCategoryEnum value

